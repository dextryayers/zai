[profile]
name = "default"

[model]
default = "qwen2.5-3b-instruct-q4_k_m"
n_ctx = 4096
n_threads = 0
n_gpu_layers = 0
temp_chat = 0.6
temp_code = 0.2
top_p = 0.9
seed = 0
timeout_s = 120

[index]
paths = ["./docs", "./src"]
ext = ["md", "rs", "toml", "txt"]
exclude = ["target/**", ".git/**", "node_modules/**", "dist/**"]
chunk_tokens = 512
overlap_tokens = 64
top_k = 5
max_file_mb = 5

[tools]
shell_allowlist = ["cargo test", "cargo test --quiet", "cargo fmt --check", "git status", "git diff"]
shell_denylist = ["rm -rf", "sudo", "mkfs"]
auto_apply = false
confirm_shell = true
max_steps = 12

[ui]
theme = "auto"
right_rail = true
stream_flush_ms = 16
