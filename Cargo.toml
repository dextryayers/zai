[workspace]
members = [
  "crates/cli",
  "crates/ui",
  "crates/core",
  "crates/models",
  "crates/infer",
  "crates/tools",
  "crates/ingest",
  "crates/rag",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.41", features = ["full"] }
rayon = "1.10"
walkdir = "2.5"
ignore = "0.4"
regex = "1.11"
toml = "0.8"
directories = "5.0"
nu-ansi-term = "0.50"
indicatif = "0.17"
similar = "2.6"
tracing = "0.1"
tempfile = "3.10"
rustyline = "14.0"
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
