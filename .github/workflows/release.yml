name: release
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash scripts/check-no-emdash.sh
      - run: bash scripts/offline-test.sh
      - run: cargo build --locked --release -p zai
      - run: tar -czf zai-${{ matrix.os }}.tar.gz -C target/release zai
      - run: sha256sum zai-${{ matrix.os }}.tar.gz > zai-${{ matrix.os }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: zai-${{ matrix.os }}
          path: |
            zai-${{ matrix.os }}.tar.gz
            zai-${{ matrix.os }}.tar.gz.sha256
