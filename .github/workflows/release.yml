name: release
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo build --locked --release -p aicli
      - run: tar -czf aicli-${{ matrix.os }}.tar.gz -C target/release aicli
      - uses: actions/upload-artifact@v4
        with:
          name: aicli-${{ matrix.os }}
          path: aicli-${{ matrix.os }}.tar.gz
